services:
  # ============================================
  # TRAEFIK - Reverse Proxy & SSL Manager
  # ============================================
  traefik:
    image: traefik:v3.2
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/config:/etc/traefik/config:ro
      - ./traefik/acme:/etc/traefik/acme
    networks:
      - web
    labels:
      - "traefik.enable=true"

      # ===== Traefik Dashboard (HTTPS) =====
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.fairuzfd.site`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=dashboard-auth"

      # Basic Auth Dashboard
      # admin / admin (GANTI DI PRODUCTION)
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=admin:$$apr1$$H6uskkkW$$IgXLP6ewTrSuBkTrqE8wj/"

  # ============================================
  # FRONTEND - React / Vite (Nginx)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=https://api.fairuzfd.site/api
        - VITE_FILE_SERVER_URL=https://api.fairuzfd.site
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - web
    labels:
      - "traefik.enable=true"

      # HTTPS Router
      - "traefik.http.routers.frontend.rule=Host(`fairuzfd.site`,`www.fairuzfd.site`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  # ============================================
  # BACKEND - Node.js API
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - web
    labels:
      - "traefik.enable=true"

      # API HTTPS Router
      - "traefik.http.routers.backend.rule=Host(`api.fairuzfd.site`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=3001"

      # CORS Middleware
      - "traefik.http.middlewares.backend-cors.headers.accesscontrolallowmethods=GET,OPTIONS,PUT,POST,DELETE,PATCH"
      - "traefik.http.middlewares.backend-cors.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.backend-cors.headers.accesscontrolalloworiginlist=https://fairuzfd.site,https://www.fairuzfd.site"
      - "traefik.http.middlewares.backend-cors.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.backend-cors.headers.addvaryheader=true"
      - "traefik.http.routers.backend.middlewares=backend-cors"

# ============================================
# NETWORKS
# ============================================
networks:
  web:
    name: web
    driver: bridge

# ============================================
# VOLUMES
# ============================================
volumes:
  backend_uploads:
    driver: local
